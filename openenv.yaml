spec_version: 1
name: airline_recovery
version: 0.5.0
type: space
runtime: fastapi
app: airline_recovery.openenv_adapter.app:app
port: 8000
validation:
  reward:
    range: [0.0, 1.0]
    oracle_tolerance: 0.0
    floor_margin: 0.1
  resources:
    cpu: 2.0
    memory_mb: 2048
    disk_mb: 1024
    episode_timeout_s: 300.0
  capabilities:
    verifier:
      kind: reward_channel
    task_api: true
    declared_tools: [get_metrics, get_logs, get_config, patch_config, restart_service, query_sql, replay_events, quarantine_event, invalidate_cache, reconcile_booking, provider_lookup, void_booking, probe, finish]
    declared_task_count: {train: 5, eval: 3, test: 3}
  types:
    tags: [sre, stateful, tool-use]
